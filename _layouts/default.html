<!DOCTYPE html>
<html lang="zh-CN" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#main-content">跳到正文</a>
  {% include header.html %}
  <div class="site-container">
    {% include sidebar.html %}
    <main id="main-content" class="main-content{% if page.url == '/' %} home-main{% endif %}" tabindex="-1">{{ content }}<a class="back-to-top" href="#top" aria-label="回到顶部" title="回到顶部" hidden>{% include icon.html name='arrow-up' %}</a></main>
    {% include right-sidebar.html %}
  </div>
  {% include footer.html %}
</body>
</html>

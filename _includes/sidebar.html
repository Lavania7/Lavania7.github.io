<aside class="sidebar" aria-label="文章列表">
  <details class="panel-disclosure" data-responsive-panel open>
    <summary class="mobile-panel-toggle">{% include icon.html name='book' %}<span>文章列表</span><span class="count">{{ site.posts.size }}</span>{% include icon.html name='chevron-down' %}</summary>
    <div class="sidebar-content">
      <nav class="post-list" aria-label="可阅读的文章">
        {% for post in site.posts %}
        <a class="post-list-item{% if page.url == post.url %} is-current{% endif %}" href="{{ post.url | relative_url }}"{% if page.url == post.url %} aria-current="page"{% endif %}>
          <span><strong>{{ post.title | escape }}</strong></span>
        </a>
        {% else %}<p class="empty-state">第一篇笔记正在路上。</p>{% endfor %}
      </nav>
    </div>
  </details>
</aside>

<div class="site-masthead">
  <header class="site-header">
    <div class="header-inner">
      <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Iris Howard 首页">
        <img class="avatar brand-avatar" src="{{ '/assets/picture/head1.jpg' | relative_url }}" alt="Iris Howard 的头像" width="36" height="36">
        <span class="site-title">{{ site.title | escape }}</span>
      </a>
      <span class="brand-note">Viva la vida</span>
      <form class="site-search" role="search" autocomplete="off" data-search-url="{{ '/search.json' | relative_url }}">
        <label class="sr-only" for="site-search-input">搜索文章</label>
        <input id="site-search-input" type="search" placeholder="搜索文章" aria-controls="search-results" aria-expanded="false">
        <button type="submit" aria-label="搜索"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg></button>
        <div class="search-results" id="search-results" hidden></div>
      </form>
      <div class="header-actions">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="当前主题：跟随系统。点击切换为纯白" title="跟随系统 · 点击切换为纯白">
          <span class="theme-icon" data-theme-icon="light">{% include icon.html name='sun' %}</span>
          <span class="theme-icon" data-theme-icon="dark">{% include icon.html name='moon' %}</span>
          <span class="theme-icon" data-theme-icon="system">{% include icon.html name='monitor' %}</span>
        </button>
        <time class="site-rtc" id="site-rtc" aria-label="本地时间">--:--:--</time>
        <span class="sr-only" id="theme-status" role="status"></span>
      </div>
    </div>
  </header>
  <div class="topics-bar">
    <nav class="topics-inner" aria-label="文章主题">
      <a class="topics-home{% if page.url == '/' %} is-current{% endif %}" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>{% include icon.html name='book' %}<span>All</span></a>
      <span class="topic-divider" aria-hidden="true"></span>
      {% for domain in site.data.navigation %}
      <details class="topic-menu{% if page.domain == domain.key %} is-current{% endif %}" data-domain="{{ domain.key | escape }}">
        <summary>{{ domain.label | escape }} {% include icon.html name='chevron-down' %}</summary>
        <div class="topic-dropdown">
          <a href="{{ '/' | relative_url }}?domain={{ domain.key }}">All</a>
          {% for activity in domain.activities %}
          <a href="{{ '/' | relative_url }}?domain={{ domain.key }}&activity={{ activity.key }}">{{ activity.label | escape }}</a>
          {% endfor %}
        </div>
      </details>
      {% endfor %}
    </nav>
  </div>
</div>
